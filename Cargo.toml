[package]
name        = "micro-h2"
version     = "0.0.1"
edition     = "2024"
rust-version = "1.88"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/no-std-rs/micro-h2"
description = "A minimal no_std, allocation-free HTTP/2 client: framing, HPACK, and a bounded number of streams"
readme      = "README.md"
keywords    = ["http2", "hpack", "no-std", "embedded", "sans-io"]
categories  = ["network-programming", "no-std", "web-programming::http-client"]

[dependencies]
heapless = "0.9"

[dev-dependencies]
bytes = "1"
fluke-hpack = "0.3"
h2 = "0.4"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
