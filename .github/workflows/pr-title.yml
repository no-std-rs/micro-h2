name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
          scopes: |
            micro-h2
            main
          # Runnerless uses chore(main) for release PRs targeting main.
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Use a lowercase imperative subject, e.g. "fix(micro-h2): reject invalid frames".
